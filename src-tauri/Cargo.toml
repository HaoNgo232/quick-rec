[package]
name = "quick-rec"
version = "1.0.0"
description = "Quick Screen Region Recorder for Linux & Windows"
authors = ["Hao <hao@local>"]
edition = "2021"

[lib]
name = "quick_rec_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "quick-rec"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
tauri = { version = "2.1", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-global-shortcut = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
arboard = "3.4"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
dirs = "5.0"
libc = "0.2"
crossbeam-channel = "0.5"

[dev-dependencies]
tempfile = "3.17"
